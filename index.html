<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(circle at 15% 10%,#fff3a8,transparent 45%),radial-gradient(circle at 90% 30%,#b6ffb0,transparent 45%),#f6fff1;color:#0c3a1a;font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4svh,34px);padding:18px}
.card{width:100%;max-width:600px;padding:8px;border-radius:26px;background:#fff;box-shadow:0 22px 50px #0b5a2a40,0 0 0 3px #ffd23f;transform:rotate(-1.5deg);animation:sway 5s ease-in-out infinite}
.card img{display:block;width:100%;height:auto;border-radius:19px}
@keyframes sway{50%{transform:rotate(1.2deg) translateY(-6px)}}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:16px 36px;border-radius:16px;background:linear-gradient(180deg,#2fe36b,#0b9a3d);color:#fff;font:900 22px Impact,"Arial Black",sans-serif;letter-spacing:1px;text-transform:uppercase;text-decoration:none;box-shadow:0 7px 0 #066a28,0 14px 30px #0b9a3d66;animation:pop 1.8s infinite}
.btn span{font-size:26px}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(100deg,transparent,#fff9,transparent);transform:skewX(-20deg);animation:shine 3s infinite}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #066a28}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes shine{to{left:130%}}
.pitch{position:relative;height:22svh;min-height:130px;background:repeating-linear-gradient(90deg,#1fa84a 0 60px,#18943f 60px 120px);border-radius:50% 50% 0 0/26px 26px 0 0;display:flex;align-items:flex-end;justify-content:center;padding:0 16px 14px}
.ball{position:absolute;top:16px;left:-60px;font-size:34px;animation:roll 7s linear infinite}
@keyframes roll{to{left:110%;transform:rotate(1080deg)}}
small{font-size:11px;color:#fff;text-shadow:0 1px 3px #0008}
small b{color:#ffd23f}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
